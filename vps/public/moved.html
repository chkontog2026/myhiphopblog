<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="4;url=https://myhiphopblog.chkontog.com/">
  <link rel="canonical" href="https://myhiphopblog.chkontog.com/">
  <title>Μεταφερθήκαμε — MY HIP HOP BLOG</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f5f5;
      background:
        radial-gradient(circle at top, rgba(168, 255, 80, 0.12), transparent 36%),
        #0e0f0e;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(32px, 7vw, 58px);
      text-align: center;
      background: #171917;
      border: 1px solid #303530;
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #b7ff73;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 9vw, 4.3rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    p {
      margin: 22px auto 0;
      color: #c8ccc8;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.65;
    }

    a {
      overflow-wrap: anywhere;
    }

    .destination {
      color: #b7ff73;
      font-weight: 700;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 50px;
      margin-top: 30px;
      padding: 0 24px;
      color: #101310;
      background: #b7ff73;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      background: #c9ff97;
      transform: translateY(-2px);
    }

    .countdown {
      margin-top: 20px;
      color: #858b85;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MY HIP HOP BLOG</p>
    <h1>Μεταφερθήκαμε!</h1>
    <p>
      Η νέα μας διεύθυνση είναι<br>
      <a class="destination" href="https://myhiphopblog.chkontog.com/">myhiphopblog.chkontog.com</a>
    </p>
    <a class="button" href="https://myhiphopblog.chkontog.com/">Μετάβαση στο νέο site</a>
    <p class="countdown" aria-live="polite">Αυτόματη ανακατεύθυνση σε <span id="seconds">4</span> δευτερόλεπτα.</p>
  </main>
  <script>
    (() => {
      const destination = "https://myhiphopblog.chkontog.com/";
      const secondsElement = document.getElementById("seconds");
      let remaining = 4;

      const timer = window.setInterval(() => {
        remaining -= 1;
        secondsElement.textContent = String(Math.max(remaining, 0));

        if (remaining <= 0) {
          window.clearInterval(timer);
          window.location.replace(destination);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
